name: Deploy redirect to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create redirect pages
        run: |
          mkdir public
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta charset="utf-8">
              <title>Redirecting...</title>
              <script>
                const path = window.location.pathname.replace(/^\/blog/, '') || '/';
                window.location.replace('https://crawforc3.github.io' + path + window.location.hash);
              </script>
            </head>
            <body>
              <p>This site has moved to <a href="https://crawforc3.github.io">crawforc3.github.io</a>.</p>
            </body>
          </html>
          EOF
          cp public/index.html public/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
